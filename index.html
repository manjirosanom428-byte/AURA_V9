<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA V9</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b12;
    color: white;
    min-height: 100vh;
}

.app {
    max-width: 1100px;
    margin: auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 18px 20px;
    border-bottom: 1px solid #292936;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

.status {
    font-size: 13px;
    color: #70ff9b;
}

.profile {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon-btn {
    width: auto;
    padding: 9px 12px;
}

.usage {
    margin: 20px;
    padding: 18px;
    border: 1px solid #292936;
    border-radius: 16px;
    background: #12121b;
}

.usage h2 {
    margin-bottom: 15px;
    font-size: 18px;
}

.usage-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.usage-card {
    background: #1a1a25;
    border-radius: 12px;
    padding: 15px;
}

.usage-card .title {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 8px;
}

.usage-card .value {
    font-size: 20px;
    font-weight: bold;
}

.chat {
    flex: 1;
    margin: 0 20px;
    border: 1px solid #292936;
    border-radius: 16px;
    background: #101018;
    display: flex;
    flex-direction: column;
    min-height: 500px;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.welcome {
    text-align: center;
    margin-top: 80px;
}

.welcome h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

.welcome p {
    color: #aaa;
}

.message {
    margin-bottom: 15px;
    padding: 12px 15px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    margin-left: auto;
    background: #25253a;
}

.aura {
    background: #181824;
}

.message-time {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    color: #666;
}

.composer {
    border-top: 1px solid #292936;
    padding: 15px;
}

textarea {
    width: 100%;
    min-height: 70px;
    resize: none;
    background: #181824;
    color: white;
    border: 1px solid #30303d;
    border-radius: 12px;
    padding: 12px;
    outline: none;
    font-size: 15px;
}

textarea:focus {
    border-color: #70ff9b;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    background: #242438;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #33334d;
}

.send {
    margin-left: auto;
    background: #70ff9b;
    color: #07100a;
    font-weight: bold;
}

.kural {
    background: #70ff9b;
    color: #07100a;
    font-weight: bold;
}

.music-panel {
    display: none;
    margin: 0 20px 15px;
    padding: 20px;
    border-radius: 16px;
    border: 1px solid #45455a;
    background:
        linear-gradient(
            135deg,
            #171727,
            #25253a
        );
}

.music-panel.active {
    display: block;
}

.music-title {
    font-size: 22px;
    font-weight: bold;
}

.music-info {
    color: #aaa;
    margin-top: 5px;
}

.music-controls {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

footer {
    padding: 15px 20px;
    text-align: center;
    color: #666;
    font-size: 12px;
}

@media (max-width: 700px) {

    .usage-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .message {
        max-width: 90%;
    }

    .logo {
        font-size: 22px;
    }

    .send {
        margin-left: 0;
    }

    .buttons button {
        flex: 1;
        min-width: 110px;
    }
}
/* AURA V9 INTRO */
#auraIntro {
    position: fixed;
    inset: 0;
    background: #0b0b12;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    animation: introFadeOut 1s ease 3.5s forwards;
}

.intro-logo {
    font-size: 64px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #70ff9b;
    text-shadow:
        0 0 10px #70ff9b,
        0 0 30px #70ff9b;
    animation: introPulse 1.5s ease-in-out infinite;
}

.intro-line {
    width: 0;
    height: 2px;
    background: #70ff9b;
    margin-top: 20px;
    box-shadow: 0 0 15px #70ff9b;
    animation: introLine 2s ease forwards;
}

.intro-status {
    margin-top: 15px;
    color: #aaa;
    font-size: 13px;
    letter-spacing: 3px;
    animation: introText 1s ease 1s both;
}

@keyframes introPulse {
    0%, 100% {
        transform: scale(1);
        opacity: 0.8;
    }
    50% {
        transform: scale(1.05);
        opacity: 1;
    }
}

@keyframes introLine {
    from {
        width: 0;
    }
    to {
        width: 280px;
    }
}

@keyframes introText {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes introFadeOut {
    to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
}
</style>
</head>

<body>
<div id="auraIntro">
    <div class="intro-logo">AURA V9</div>
    <div class="intro-line"></div>
    <div class="intro-status">INITIALIZING...</div>
</div>
<div class="app">

<header>

    <div>
        <div class="logo">AURA V9</div>
        <div class="profile" id="profileName">
            User
        </div>
    </div>

    <div class="top-actions">

        <div class="status">
            ● ONLINE
        </div>

        <button
            class="icon-btn"
            onclick="newChat()"
            title="New Chat"
        >
            ＋
        </button>

        <button
            class="icon-btn"
            onclick="clearHistory()"
            title="Clear History"
        >
            🗑️
        </button>

        <button
            class="icon-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>



<div
    class="music-panel"
    id="musicPanel"
>

    <div class="music-title">
        🎵 AURA MUSIC
    </div>

    <div
        class="music-info"
        id="musicInfo"
    >
        Music mode ready
    </div>

    <div class="music-controls">

        <button onclick="speakMusicArtist()">
            🔊 Artist
        </button>

        <button onclick="closeMusicMode()">
            ✕ Close
        </button>

    </div>

</div>


<section class="chat">

    <div
        class="messages"
        id="messages"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                Welcome to AURA 🤖
            </h1>

            <p>
                Your AI assistant is ready.
            </p>

        </div>

    </div>


    <div class="composer">

        <textarea
            id="prompt"
            placeholder="Ask AURA anything..."
        ></textarea>

        <div class="buttons">

            <button
                class="kural"
                onclick="toggleKural()"
            >
                🎙️ Kural
            </button>

            

            <button onclick="musicMode()">
                🎵 Music
            </button>

            <button
                class="send"
                onclick="sendChat()"
            >
                💬 Send
            </button>

        </div>

    </div>

</section>


<footer>
    AURA V9 • Ollama AI • Persistent User Data
</footer>

</div>

<script>
const API_BASE = "https://aura-v9-2.onrender.com";
/* ==========================================
   USER
========================================== */

const USER_ID = localStorage.getItem("auraUser");

if (!USER_ID) {
    window.location.href = "/login.html";
}


/* ==========================================
   PROFILE
========================================== */

async function loadProfile() {
    try {
        const response = await fetch(
            `/api/profile?userId=${encodeURIComponent(USER_ID)}`
        );

        const data = await response.json();

        if (data.success) {
            document.getElementById("profileName").textContent =
                `👤 ${data.profile.username}`;
        }
    } catch (error) {
        console.error("Profile error:", error);
    }
}


/* ==========================================
   USAGE
========================================== */

async function loadUsage() {
    try {
        const response = await fetch(
            `/api/usage?userId=${encodeURIComponent(USER_ID)}`
        );

        const data = await response.json();

        if (!data.success) return;

        document.getElementById("imagesUsage").textContent =
            `${data.usage.images.used} / ${data.usage.images.limit}`;

        document.getElementById("video10Usage").textContent =
            `${data.usage.video10s.used} / ${data.usage.video10s.limit}`;

        document.getElementById("video60Usage").textContent =
            `${data.usage.video1min.used} / ${data.usage.video1min.limit}`;

    } catch (error) {
        console.error("Usage error:", error);
    }
}


/* ==========================================
   MESSAGE
========================================== */

function addMessage(text, type, time = null) {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const messages = document.getElementById("messages");

    const div = document.createElement("div");

    div.className = `message ${type}`;

    div.textContent = text;

    if (time) {

        const timeElement = document.createElement("span");

        timeElement.className = "message-time";

        timeElement.textContent =
            new Date(time).toLocaleString();

        div.appendChild(timeElement);
    }

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
}


/* ==========================================
   LOAD HISTORY
========================================== */

async function loadHistory() {

    try {

        const response = await fetch(
            `/api/history?userId=${encodeURIComponent(USER_ID)}`
        );

        const data = await response.json();

        if (!data.success) return;

        const messages =
            document.getElementById("messages");

        messages.innerHTML = "";

        if (!data.history || data.history.length === 0) {

            messages.innerHTML = `
                <div class="welcome" id="welcome">
                    <h1>Welcome back 🤖</h1>
                    <p>Your AURA conversation is ready.</p>
                </div>
            `;

            return;
        }

        data.history.forEach(item => {

            addMessage(
                item.content,
                item.role === "user" ? "user" : "aura",
                item.time
            );

        });

    } catch (error) {

        console.error("History error:", error);

    }
}


/* ==========================================
   NEW CHAT
========================================== */

async function newChat() {

    try {

        const response = await fetch(
            "/api/new-chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    userId: USER_ID
                })
            }
        );

        const data = await response.json();

        if (!data.success) {

            addMessage(
                data.error || "Could not start new chat.",
                "aura"
            );

            return;
        }

        const messages =
            document.getElementById("messages");

        messages.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>Vaanga, Vanakkam! 👋</h1>
                <p>New AURA conversation started.</p>
            </div>
        `;

        speak("Vaanga, Vanakkam!");

    } catch (error) {

        console.error("New chat error:", error);

    }
}


/* ==========================================
   CLEAR HISTORY
========================================== */

async function clearHistory() {

    const confirmed =
        confirm("Clear all your AURA chat history?");

    if (!confirmed) return;

    try {

        const response = await fetch(
            "/api/history",
            {
                method: "DELETE",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    userId: USER_ID
                })
            }
        );

        const data = await response.json();

        if (data.success) {
            await newChat();
        } else {
            alert(data.error || "Could not clear history.");
        }

    } catch (error) {

        alert("Could not connect to AURA.");

    }
}


/* ==========================================
   CHAT
========================================== */

async function sendChat() {

    const input =
        document.getElementById("prompt");

    const message =
        input.value.trim();
    if (
        message.toLowerCase().startsWith("play ") ||
        message.toLowerCase().startsWith("play song ")
    ) {
        const query = message
            .replace(/^play song /i, "")
            .replace(/^play /i, "")
            .trim();

        if (query) {
            document.getElementById("musicPanel").classList.add("active");

            document.getElementById("musicInfo").textContent =
                `🎵 Searching for "${query}"...`;

            const youtubeUrl =
                "https://www.youtube.com/results?search_query=" +
                encodeURIComponent(query);

            window.open(youtubeUrl, "_blank");

            return;
        }
    }
    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    addMessage("AURA is thinking...", "aura");

    try {

        const response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    userId: USER_ID,
                    message: message
                })
            }
        );

        const data = await response.json();

        const messages =
            document.getElementById("messages");

        const thinking =
            messages.querySelectorAll(".aura");

        if (thinking.length) {
            thinking[thinking.length - 1].remove();
        }

        if (data.success) {

            addMessage(
                data.reply,
                "aura",
                new Date().toISOString()
            );

            if (voiceEnabled) {
                speak(data.reply);
            }

        } else {

            addMessage(
                data.error || "Something went wrong.",
                "aura"
            );
        }

    } catch (error) {

        console.error("Chat error:", error);

        addMessage(
            "❌ Cannot connect to AURA server.",
            "aura"
        );
    }
}


/* ==========================================
   KURAL — SPEAKING
========================================== */

let voiceEnabled = false;
function toggleKural() {

    voiceEnabled = !voiceEnabled;

    const button = document.querySelector(".kural");

    if (voiceEnabled) {

        button.textContent = "🎙️ Kural ON";

        speak(`Vanakkam ${USER_ID}. Sollunga.`);

        setTimeout(() => {
            startKuralListening();
        }, 700);

    } else {

        button.textContent = "🎙️ Kural";

        if ("speechSynthesis" in window) {
            speechSynthesis.cancel();
        }

        if (recognition && listening) {
            recognition.stop();
        }
    }
}

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.rate = 1;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


/* ==========================================
   KURAL — VOICE INPUT
========================================== */

let recognition = null;
let listening = false;

function startKuralListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser. Please use Chrome."
        );

        return;
    }

    if (listening) {

        recognition.stop();

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.continuous = false;

    recognition.interimResults = true;

    listening = true;

    updateKuralButton(true);

    recognition.onstart = function() {

        updateKuralButton(true);

    };


    recognition.onresult = function(event) {

        let finalText = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const transcript =
                event.results[i][0].transcript;

            if (
                event.results[i].isFinal
            ) {

                finalText += transcript;

            }
        }

        if (finalText) {

            document.getElementById(
                "prompt"
            ).value = finalText;

        }

    };


    recognition.onerror = function(event) {

        console.error(
            "Kural voice error:",
            event.error
        );

        listening = false;

        updateKuralButton(false);

    };


    recognition.onend = function() {

        listening = false;

        updateKuralButton(false);

    };


    recognition.start();
}


function updateKuralButton(active) {

    const button =
        document.querySelector(".kural");

    if (!button) return;

    if (active) {

        button.textContent =
            "🔴 Kural Listening...";

        button.style.background =
            "#ff5252";

        button.style.color =
            "white";

    } else {

        button.textContent =
            voiceEnabled
                ? "🎙️ Kural ON"
                : "🎙️ Kural";

        button.style.background =
            "#70ff9b";

        button.style.color =
            "#07100a";
    }
}

/* ==========================================
   MUSIC MODE
========================================== */

function musicMode() {
    const panel = document.getElementById("musicPanel");

    panel.classList.add("active");

    document.getElementById("musicInfo").textContent =
        "🎵 Type a song name, then choose YouTube or Spotify.";

    const controls = panel.querySelector(".music-controls");

    controls.innerHTML = `
        <button onclick="playOnYouTube()">
            ▶️ YouTube
        </button>

        <button onclick="playOnSpotify()">
            🎧 Spotify
        </button>

        <button onclick="closeMusicMode()">
            ✕ Close
        </button>
    `;
}

function getMusicQuery() {
    const input = document.getElementById("prompt");
    const query = input.value.trim();

    if (!query) {
        addMessage("🎵 First type a song name.", "aura");
        return null;
    }

    return query;
}

function playOnYouTube() {
    const query = getMusicQuery();

    if (!query) return;

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);

    document.getElementById("musicInfo").textContent =
        `▶️ YouTube: ${query}`;

    window.open(url, "_blank");
}

function playOnSpotify() {
    const query = getMusicQuery();

    if (!query) return;

    const url =
        "https://open.spotify.com/search/" +
        encodeURIComponent(query);

    document.getElementById("musicInfo").textContent =
        `🎧 Spotify: ${query}`;

    window.open(url, "_blank");
}

function closeMusicMode() {
    document.getElementById("musicPanel")
        .classList.remove("active");
}

async function generateImage() {

    const prompt =
        document.getElementById("prompt").value.trim();

    if (!prompt) {
        addMessage(
            "Please enter an image prompt first.",
            "aura"
        );
        return;
    }

    addMessage(
        "🖼️ AURA is preparing your image...",
        "aura"
    );

    try {

        const response = await fetch(
            "/api/generate-image",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userId: USER_ID,
                    prompt: prompt
                })
            }
        );

        const data = await response.json();

        if (data.success && data.image) {

            const box =
                document.createElement("div");

            box.className = "message aura";

            const image =
                document.createElement("img");

            image.src = data.image;
            image.alt = prompt;
            image.style.width = "100%";
            image.style.maxWidth = "700px";
            image.style.borderRadius = "14px";

            box.appendChild(image);

            document
                .getElementById("messages")
                .appendChild(box);

        } else {

            addMessage(
                data.message ||
                data.error ||
                "Image generation unavailable.",
                "aura"
            );
        }

        loadUsage();

    } catch (error) {

        console.error("Image error:", error);

        addMessage(
            "❌ Image request failed.",
            "aura"
        );
    }
}




/* ==========================================
   VIDEO
========================================== */

async function generateVideo(duration) {

    const prompt =
        document.getElementById(
            "prompt"
        ).value.trim();

    if (!prompt) {

        addMessage(
            "Please enter a video prompt first.",
            "aura"
        );

        return;
    }

    addMessage(
        `🎬 Generating ${
            duration === 10
                ? "10-second"
                : "1-minute"
        } video...`,
        "aura"
    );

    try {

        const response = await fetch(
            "/api/generate-video",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    userId: USER_ID,
                    prompt: prompt,
                    duration: duration
                })
            }
        );

        const data = await response.json();

        addMessage(
            data.message ||
            data.error ||
            "Video generation unavailable.",
            "aura"
        );

        loadUsage();

    } catch (error) {

        addMessage(
            "❌ Video request failed.",
            "aura"
        );
    }
}


/* ==========================================
   ENTER
========================================== */

document
    .getElementById("prompt")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendChat();
            }
        }
    );


/* ==========================================
   IMPORTANT:
   CLICK KURAL = LISTEN + SPEAK MODE
========================================== */

document
    .querySelector(".kural")
    .onclick = function() {

        if (!voiceEnabled) {

            voiceEnabled = true;

            speak(
                `Vanakkam ${USER_ID}. Sollunga.`
            );

        }

        startKuralListening();
    };


/* ==========================================
   START
========================================== */

loadProfile();
loadUsage();
loadHistory();

</script>
</body>
</html>
