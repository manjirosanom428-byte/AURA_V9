<!DOCTYPE html>
<html lang="en">

<head>
<script src="https://js.puter.com/v2/"></script>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AURA V9</title>

<style>
.aura-thinking-animation {
    width: 55px;
    height: 40px;
    object-fit: contain;
    display: block;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #05020c;

    color: white;

    min-height: 100vh;

    overflow-x: hidden;
}

/* ==========================================
   ANIME BACKGROUND
========================================== */

body::before {

    content: "";

    position: fixed;

    inset: -5%;

    z-index: -5;

    background-image:
        linear-gradient(
            rgba(5, 2, 12, 0.30),
            rgba(5, 2, 12, 0.48)
        ),
        url("aura-bg.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    animation:
        animeBackground
        18s
        ease-in-out
        infinite
        alternate;

    transform: scale(1.02);
}

/* ==========================================
   PURPLE ENERGY
========================================== */

body::after {

    content: "";

    position: fixed;

    inset: -30%;

    z-index: -4;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 20% 30%,
            rgba(190, 60, 255, 0.38),
            transparent 20%
        ),

        radial-gradient(
            circle at 70% 35%,
            rgba(110, 30, 255, 0.32),
            transparent 25%
        ),

        radial-gradient(
            circle at 45% 75%,
            rgba(160, 40, 255, 0.28),
            transparent 25%
        );

    filter: blur(22px);

    animation:
        purpleEnergy
        8s
        ease-in-out
        infinite
        alternate;
}

@keyframes animeBackground {

    0% {
        background-position: 48% 50%;
        transform: scale(1);
    }

    50% {
        background-position: 52% 48%;
        transform: scale(1.04);
    }

    100% {
        background-position: 48% 52%;
        transform: scale(1.07);
    }
}

@keyframes purpleEnergy {

    0% {
        transform:
            translate(-3%, -2%)
            rotate(0deg)
            scale(1);

        opacity: 0.55;
    }

    50% {
        transform:
            translate(4%, 3%)
            rotate(3deg)
            scale(1.08);

        opacity: 0.9;
    }

    100% {
        transform:
            translate(-2%, 5%)
            rotate(-3deg)
            scale(1.04);

        opacity: 0.65;
    }
}

/* ==========================================
   PARTICLES
========================================== */

.aura-particles {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 1;
}

.aura-particle {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #c77dff;

    box-shadow:
        0 0 8px #a855f7,
        0 0 18px #7c3aed,
        0 0 30px #9333ea;

    animation:
        particleFloat
        8s
        linear
        infinite;
}

@keyframes particleFloat {

    0% {

        transform:
            translateY(110vh)
            translateX(-20px)
            scale(0.5);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    50% {

        transform:
            translateY(50vh)
            translateX(40px)
            scale(1.3);

        opacity: 0.8;
    }

    80% {
        opacity: 1;
    }

    100% {

        transform:
            translateY(-10vh)
            translateX(-60px)
            scale(0.4);

        opacity: 0;
    }
}

/* ==========================================
   INTRO
========================================== */

#auraIntro {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            #241044,
            #05020c 65%
        );

    animation:
        introFade
        2.5s
        ease
        forwards;

    pointer-events: none;
}

.intro-logo {

    font-size: 60px;

    font-weight: 900;

    letter-spacing: 8px;

    color: #d8a0ff;

    text-shadow:
        0 0 10px #a855f7,
        0 0 30px #7c3aed,
        0 0 60px #9333ea;

    animation:
        logoPulse
        1.2s
        ease-in-out
        infinite alternate;
}

.intro-line {

    width: 0;

    height: 2px;

    margin-top: 20px;

    background: #c77dff;

    box-shadow:
        0 0 15px #a855f7,
        0 0 30px #9333ea;

    animation:
        lineLoad
        1.5s
        ease
        forwards;
}

.intro-status {

    margin-top: 15px;

    font-size: 13px;

    letter-spacing: 4px;

    color: #c9a8ff;
}

@keyframes logoPulse {

    from {
        transform: scale(1);
        opacity: 0.75;
    }

    to {
        transform: scale(1.05);
        opacity: 1;
    }
}

@keyframes lineLoad {

    from {
        width: 0;
    }

    to {
        width: 260px;
    }
}

@keyframes introFade {

    0% {
        opacity: 1;
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        visibility: hidden;
    }
}

/* ==========================================
   APP
========================================== */

.app {

    width: 100%;

    min-height: 100vh;

    position: relative;

    z-index: 2;

    display: flex;

    flex-direction: column;
}

/* ==========================================
   HEADER
========================================== */

header {

    min-height: 75px;

    padding:
        15px 25px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background:
        rgba(8, 3, 20, 0.72);

    backdrop-filter: blur(14px);

    border-bottom:
        1px solid
        rgba(168, 85, 247, 0.35);
}

.logo {

    font-size: 25px;

    font-weight: 900;

    letter-spacing: 3px;

    color: #d8a0ff;

    text-shadow:
        0 0 10px #9333ea,
        0 0 25px #7c3aed;
}

.profile {

    margin-top: 5px;

    font-size: 13px;

    color: #c9b5df;
}

.top-actions {

    display: flex;

    align-items: center;

    gap: 10px;
}

.status {

    color: #70ff9b;

    font-size: 12px;

    font-weight: bold;
}

.icon-btn {

    border: 1px solid
        rgba(168, 85, 247, 0.55);

    background:
        rgba(55, 15, 90, 0.65);

    color: white;

    padding:
        9px 13px;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.25s;
}

.icon-btn:hover {

    transform: translateY(-2px);

    background:
        rgba(120, 40, 190, 0.7);

    box-shadow:
        0 0 18px
        rgba(168, 85, 247, 0.45);
}

/* ==========================================
   CHAT
========================================== */

.chat {

    width: min(1000px, 94%);

    margin:
        20px auto;

    flex: 1;

    display: flex;

    flex-direction: column;

    min-height:
        calc(100vh - 145px);
}

.messages {

    flex: 1;

    overflow-y: auto;

    padding:
        20px;

    border-radius: 22px;

    background:
        rgba(8, 3, 20, 0.50);

    backdrop-filter: blur(12px);

    border:
        1px solid
        rgba(168, 85, 247, 0.28);

    box-shadow:
        0 0 35px
        rgba(80, 20, 150, 0.18);
}

.welcome {

    min-height: 350px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.welcome h1 {

    font-size: 38px;

    margin-bottom: 12px;

    color: #eee0ff;

    text-shadow:
        0 0 20px
        rgba(168, 85, 247, 0.7);
}

.welcome p {

    color: #cbbbd9;

    font-size: 16px;
}

/* ==========================================
   MESSAGES
========================================== */

.message {

    max-width: 78%;

    padding:
        13px 16px;

    margin:
        10px 0;

    border-radius: 16px;

    line-height: 1.5;

    white-space: pre-wrap;

    word-wrap: break-word;
}

.message.user {

    margin-left: auto;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4c1d95
        );

    border:
        1px solid
        rgba(216, 180, 254, 0.3);

    box-shadow:
        0 0 20px
        rgba(124, 58, 237, 0.25);
}

.message.aura {

    margin-right: auto;

    background:
        rgba(28, 12, 48, 0.78);

    border:
        1px solid
        rgba(168, 85, 247, 0.32);
}

.message-time {

    display: block;

    margin-top: 6px;

    font-size: 10px;

    color: #9f8dab;
}

/* ==========================================
   COMPOSER
========================================== */

.composer {

    margin-top: 15px;

    padding: 14px;

    border-radius: 18px;

    background:
        rgba(8, 3, 20, 0.75);

    backdrop-filter: blur(15px);

    border:
        1px solid
        rgba(168, 85, 247, 0.38);
}

textarea {

    width: 100%;

    min-height: 70px;

    resize: vertical;

    border: none;

    outline: none;

    border-radius: 13px;

    padding: 14px;

    background:
        rgba(20, 8, 35, 0.9);

    color: white;

    font-size: 15px;
}

textarea::placeholder {
    color: #897a97;
}

.buttons {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 10px;

    flex-wrap: wrap;
}

.buttons button {

    border: 1px solid
        rgba(168, 85, 247, 0.45);

    background:
        rgba(55, 15, 90, 0.75);

    color: white;

    padding:
        10px 16px;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.25s;

    font-weight: bold;
}

.buttons button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 0 18px
        rgba(168, 85, 247, 0.4);
}

.buttons .send {

    background:
        linear-gradient(
            135deg,
            #9333ea,
            #6d28d9
        );
}

.buttons .kural {

    background: #70ff9b;

    color: #07100a;
}

/* ==========================================
   MUSIC PANEL
========================================== */

.music-panel {

    position: fixed;

    right: 25px;

    bottom: 95px;

    width: 300px;

    padding: 18px;

    border-radius: 18px;

    background:
        rgba(12, 4, 25, 0.94);

    backdrop-filter: blur(18px);

    border:
        1px solid
        rgba(168, 85, 247, 0.5);

    box-shadow:
        0 0 30px
        rgba(124, 58, 237, 0.35);

    transform:
        translateY(30px)
        scale(0.9);

    opacity: 0;

    pointer-events: none;

    transition: 0.3s;

    z-index: 50;
}

.music-panel.active {

    transform:
        translateY(0)
        scale(1);

    opacity: 1;

    pointer-events: auto;
}

.music-title {

    font-size: 18px;

    font-weight: bold;

    color: #d8a0ff;

    margin-bottom: 10px;
}

.music-info {

    color: #cbbbd9;

    font-size: 13px;

    line-height: 1.5;

    margin-bottom: 15px;
}

.music-controls {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}

.music-controls button {

    border: 1px solid
        rgba(168, 85, 247, 0.45);

    background:
        rgba(55, 15, 90, 0.8);

    color: white;

    padding:
        8px 11px;

    border-radius: 8px;

    cursor: pointer;
}

/* ==========================================
   FOOTER
========================================== */

footer {

    text-align: center;

    padding:
        12px;

    font-size: 11px;

    color: #9d8da9;

    background:
        rgba(5, 2, 12, 0.65);
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

    header {
        padding: 12px;
    }

    .status {
        display: none;
    }

    .logo {
        font-size: 20px;
    }

    .chat {
        width: 96%;
    }

    .message {
        max-width: 90%;
    }

    .welcome h1 {
        font-size: 28px;
    }

    .music-panel {

        right: 10px;
        left: 10px;

        width: auto;

        bottom: 80px;
    }
}
/* ==========================================
   AURA THINKING ANIMATION
========================================== */

.aura-thinking-animation {
    width: 55px;
    height: 40px;
    object-fit: contain;
    display: block;
    border-radius: 8px;
    margin: 4px 0;
}
</style>
    <script src="https://js.puter.com/v2/"></script>
</head>

<body>

<!-- PURPLE PARTICLES -->

<div class="aura-particles">

    <div class="aura-particle"
         style="left:10%; animation-delay:0s;"></div>

    <div class="aura-particle"
         style="left:25%; animation-delay:2s;"></div>

    <div class="aura-particle"
         style="left:40%; animation-delay:4s;"></div>

    <div class="aura-particle"
         style="left:55%; animation-delay:1s;"></div>

    <div class="aura-particle"
         style="left:70%; animation-delay:3s;"></div>

    <div class="aura-particle"
         style="left:85%; animation-delay:5s;"></div>

    <div class="aura-particle"
         style="left:95%; animation-delay:6s;"></div>

</div>


<!-- INTRO -->

<div id="auraIntro">

    <div class="intro-logo">
        AURA V9
    </div>

    <div class="intro-line"></div>

    <div class="intro-status">
        INITIALIZING...
    </div>

</div>


<!-- APP -->

<div class="app">

<header>

    <div>

        <div class="logo">
            AURA V9
        </div>

        <div
            class="profile"
            id="profileName"
        >
            User
        </div>

    </div>


    <div class="top-actions">

        <div class="status">
            ● ONLINE
        </div>

        <button
            class="icon-btn"
            onclick="newChat()"
        >
            ＋ New
        </button>

        <button
            class="icon-btn"
            onclick="clearHistory()"
        >
            🗑️
        </button>

        <button
            class="icon-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<!-- MUSIC -->

<div
    class="music-panel"
    id="musicPanel"
>

    <div class="music-title">
        🎵 AURA MUSIC
    </div>

    <div
        class="music-info"
        id="musicInfo"
    >
        Music mode ready
    </div>

    <div
        class="music-controls"
        id="musicControls"
    >

        <button onclick="playOnYouTube()">
            ▶️ YouTube
        </button>

        <button onclick="playOnSpotify()">
            🎧 Spotify
        </button>

        <button onclick="closeMusicMode()">
            ✕ Close
        </button>

    </div>

</div>


<!-- CHAT -->

<section class="chat">

    <div
        class="messages"
        id="messages"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                Welcome to AURA 🤖
            </h1>

            <p>
                Your AI assistant is ready.
            </p>

        </div>

    </div>


    <div class="composer">

        <textarea
            id="prompt"
            placeholder="Ask AURA anything..."
        ></textarea>


        <div class="buttons">

            <button
                class="kural"
                id="kuralButton"
            >
                🎙️ Kural
            </button>

            <button onclick="musicMode()">
                🎵 Music
            </button>

            <button
                class="send"
                onclick="sendChat()"
            >
                💬 Send
            </button>

        </div>

    </div>

</section>


<footer>
    AURA V9 • Ollama AI • Persistent User Data
</footer>

<script src="https://js.puter.com/v2/"></script>

<script>
const USER_ID = localStorage.getItem("auraUser");

if (!USER_ID) {
    window.location.href = "/login.html";
}

/* =========================
   PROFILE
========================= */

async function loadProfile() {
    try {
        const response = await fetch(
            `/api/profile?userId=${encodeURIComponent(USER_ID)}`
        );

        const data = await response.json();

        if (data.success) {
            document.getElementById("profileName").textContent =
                `👤 ${data.profile.username}`;
        }
    } catch (error) {
        console.error("Profile error:", error);
    }
}

/* =========================
   MESSAGE
========================= */

function addMessage(text, type, time = null) {
    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const messages = document.getElementById("messages");

    const div = document.createElement("div");
    div.className = `message ${type}`;

    div.textContent = text;

    if (time) {
        const timeElement = document.createElement("span");

        timeElement.className = "message-time";

        timeElement.textContent =
            new Date(time).toLocaleString();

        div.appendChild(timeElement);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

/* =========================
   THINKING DOTS
========================= */

function showThinking() {
    const messages = document.getElementById("messages");

    const div = document.createElement("div");

    div.className = "message aura";
    div.id = "auraThinking";

    div.innerHTML = `
        <span style="
            display:inline-flex;
            gap:5px;
            align-items:center;
        ">
            <span class="thinking-dot">●</span>
            <span class="thinking-dot">●</span>
            <span class="thinking-dot">●</span>
        </span>
    `;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function hideThinking() {
    const thinking =
        document.getElementById("auraThinking");

    if (thinking) {
        thinking.remove();
    }
}

/* =========================
   HISTORY
========================= */

async function loadHistory() {
    try {
        const response = await fetch(
            `/api/history?userId=${encodeURIComponent(USER_ID)}`
        );

        const data = await response.json();

        if (!data.success) return;

        const messages =
            document.getElementById("messages");

        messages.innerHTML = "";

        if (!data.history || data.history.length === 0) {
            messages.innerHTML = `
                <div class="welcome" id="welcome">
                    <h1>Welcome back 🤖</h1>
                    <p>Your AURA conversation is ready.</p>
                </div>
            `;
            return;
        }

        data.history.forEach(item => {
            addMessage(
                item.content,
                item.role === "user"
                    ? "user"
                    : "aura",
                item.time
            );
        });

    } catch (error) {
        console.error("History error:", error);
    }
}

/* =========================
   NEW CHAT
========================= */

async function newChat() {
    try {
        const response = await fetch(
            "/api/new-chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userId: USER_ID
                })
            }
        );

        const data = await response.json();

        if (!data.success) {
            addMessage(
                data.error || "Could not start new chat.",
                "aura"
            );
            return;
        }

        document.getElementById("messages").innerHTML = `
            <div class="welcome" id="welcome">
                <h1>Vaanga, Vanakkam! 👋</h1>
                <p>New AURA conversation started.</p>
            </div>
        `;

        speak("Vanakkam!");

    } catch (error) {
        console.error("New chat error:", error);
    }
}

/* =========================
   CLEAR HISTORY
========================= */

async function clearHistory() {
    const confirmed = confirm(
        "Clear all your AURA chat history?"
    );

    if (!confirmed) return;

    try {
        const response = await fetch(
            "/api/history",
            {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userId: USER_ID
                })
            }
        );

        const data = await response.json();

        if (data.success) {
            await newChat();
        } else {
            alert(
                data.error ||
                "Could not clear history."
            );
        }

    } catch (error) {
        alert("Could not connect to AURA.");
    }
}

/* =========================
   CHAT
========================= */

async function sendChat() {
    const input =
        document.getElementById("prompt");

    const message =
        input.value.trim();

    if (!message) return;

    /* MUSIC COMMAND */

    if (
        message.toLowerCase().startsWith("play ")
    ) {
        const query =
            message
                .replace(/^play\s+/i, "")
                .trim();

        if (query) {
            document
                .getElementById("musicPanel")
                .classList.add("active");

            document
                .getElementById("musicInfo")
                .textContent =
                `🎵 Searching for "${query}"...`;

            const url =
                "https://www.youtube.com/results?search_query=" +
                encodeURIComponent(query);

            window.open(url, "_blank");

            input.value = "";

            return;
        }
    }

    addMessage(message, "user");

    input.value = "";

    showThinking();

    try {

        /* =========================
           FIRST TRY YOUR SERVER
        ========================= */

        const response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    userId: USER_ID,
                    message: message
                })
            }
        );

        const data = await response.json();

        hideThinking();

        if (data.success) {

            addMessage(
                data.reply,
                "aura",
                new Date().toISOString()
            );

            if (voiceEnabled) {
                speak(data.reply);
            }

            return;
        }

        /* =========================
           PUTER FALLBACK
        ========================= */

        await puterChat(message);

    } catch (error) {

        console.error(
            "Server connection error:",
            error
        );

        hideThinking();

        try {

            await puterChat(message);

        } catch (puterError) {

            console.error(
                "Puter error:",
                puterError
            );

            addMessage(
                "❌ Cannot connect to AURA.",
                "aura"
            );
        }
    }
}

/* =========================
   PUTER AI
========================= */

async function puterChat(message) {

    showThinking();

    try {

        const response =
            await puter.ai.chat(
                message,
                {
                    model: "gpt-4o-mini"
                }
            );

        hideThinking();

        let reply = "";

        if (
            response &&
            response.message &&
            response.message.content
        ) {
            reply =
                response.message.content;
        } else if (
            response &&
            response.content
        ) {
            reply =
                response.content;
        } else {
            reply =
                String(response);
        }

        addMessage(
            reply,
            "aura",
            new Date().toISOString()
        );

        if (voiceEnabled) {
            speak(reply);
        }

    } catch (error) {

        hideThinking();

        console.error(
            "Puter AI error:",
            error
        );

        addMessage(
            "❌ AURA AI is unavailable right now.",
            "aura"
        );
    }
}

/* =========================
   VOICE
========================= */

let voiceEnabled = false;
let recognition = null;
let listening = false;

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.rate = 1;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}

function updateKuralButton(active) {

    const button =
        document.getElementById(
            "kuralButton"
        );

    if (!button) return;

    if (active) {

        button.textContent =
            "🔴 Listening...";

        button.style.background =
            "#ff5252";

        button.style.color =
            "white";

    } else {

        button.textContent =
            voiceEnabled
                ? "🎙️ Kural ON"
                : "🎙️ Kural";

        button.style.background =
            "#70ff9b";

        button.style.color =
            "#07100a";
    }
}

function startKuralListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported. Please use Chrome."
        );

        return;
    }

    if (listening) {

        recognition.stop();

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = true;

    listening = true;

    updateKuralButton(true);

    recognition.onresult =
        function(event) {

            let finalText = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0]
                        .transcript;

                if (
                    event.results[i].isFinal
                ) {
                    finalText += transcript;
                }
            }

            if (finalText) {

                document.getElementById(
                    "prompt"
                ).value = finalText;
            }
        };

    recognition.onerror =
        function(event) {

            console.error(
                "Kural error:",
                event.error
            );

            listening = false;

            updateKuralButton(false);
        };

    recognition.onend =
        function() {

            listening = false;

            updateKuralButton(false);
        };

    recognition.start();
}

document
    .getElementById("kuralButton")
    .addEventListener(
        "click",
        function() {

            if (!voiceEnabled) {

                voiceEnabled = true;

                speak(
                    `Vanakkam ${USER_ID}. Sollunga.`
                );
            }

            startKuralListening();
        }
    );

/* =========================
   MUSIC
========================= */

function musicMode() {

    const panel =
        document.getElementById(
            "musicPanel"
        );

    panel.classList.add("active");

    document.getElementById(
        "musicInfo"
    ).textContent =
        "🎵 Type a song name and choose YouTube or Spotify.";
}

function getMusicQuery() {

    const input =
        document.getElementById(
            "prompt"
        );

    const query =
        input.value.trim();

    if (!query) {

        addMessage(
            "🎵 First type a song name.",
            "aura"
        );

        return null;
    }

    return query;
}

function playOnYouTube() {

    const query =
        getMusicQuery();

    if (!query) return;

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);

    document.getElementById(
        "musicInfo"
    ).textContent =
        `▶️ YouTube: ${query}`;

    window.open(url, "_blank");
}

function playOnSpotify() {

    const query =
        getMusicQuery();

    if (!query) return;

    const url =
        "https://open.spotify.com/search/" +
        encodeURIComponent(query);

    document.getElementById(
        "musicInfo"
    ).textContent =
        `🎧 Spotify: ${query}`;

    window.open(url, "_blank");
}

function closeMusicMode() {

    document
        .getElementById("musicPanel")
        .classList.remove("active");
}

/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "auraUser"
    );

    window.location.href =
        "/login.html";
}

    .getElementById("prompt")

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();
