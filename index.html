<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA V9</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #05020c;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ==========================================
   ANIME BACKGROUND
========================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -5;

    background:
        linear-gradient(
            rgba(5, 2, 12, 0.30),
            rgba(5, 2, 12, 0.55)
        ),
        url("aura-bg.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    animation: animeBackground 18s ease-in-out infinite alternate;
}

body::after {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -4;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(168, 85, 247, 0.45),
            transparent 22%
        ),
        radial-gradient(
            circle at 50% 60%,
            rgba(124, 58, 237, 0.30),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 35%,
            rgba(192, 80, 255, 0.28),
            transparent 25%
        );

    filter: blur(25px);

    animation: purpleEnergy 8s ease-in-out infinite alternate;
}

@keyframes animeBackground {
    0% {
        background-position: 48% 50%;
        transform: scale(1);
    }

    50% {
        background-position: 52% 48%;
        transform: scale(1.03);
    }

    100% {
        background-position: 48% 52%;
        transform: scale(1.06);
    }
}

@keyframes purpleEnergy {
    0% {
        transform: rotate(0deg) scale(1);
        opacity: 0.55;
    }

    50% {
        transform: rotate(3deg) scale(1.08);
        opacity: 0.85;
    }

    100% {
        transform: rotate(-3deg) scale(1);
        opacity: 0.60;
    }
}

/* ==========================================
   PURPLE PARTICLES
========================================== */

.aura-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.aura-particle {
    position: absolute;

    width: 5px;
    height: 5px;

    background: #c77dff;
    border-radius: 50%;

    box-shadow:
        0 0 8px #a855f7,
        0 0 18px #7c3aed,
        0 0 30px #9333ea;

    animation: particleFloat 8s linear infinite;
}

@keyframes particleFloat {
    0% {
        transform:
            translateY(110vh)
            translateX(-20px)
            scale(0.5);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    50% {
        transform:
            translateY(50vh)
            translateX(40px)
            scale(1.3);

        opacity: 0.8;
    }

    80% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-10vh)
            translateX(-60px)
            scale(0.4);

        opacity: 0;
    }
}

/* ==========================================
   INTRO
========================================== */

#auraIntro {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            rgba(120, 30, 255, 0.25),
            #05020c 65%
        );

    animation: introFade 3s forwards;
    pointer-events: none;
}

.intro-logo {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 8px;

    color: #ffffff;

    text-shadow:
        0 0 10px #a855f7,
        0 0 30px #7c3aed,
        0 0 60px #9333ea;

    animation: logoPulse 1.5s ease-in-out infinite;
}

.intro-line {
    width: 240px;
    height: 3px;
    margin-top: 20px;

    background: #a855f7;

    box-shadow:
        0 0 10px #a855f7,
        0 0 25px #7c3aed;

    animation: lineMove 1.5s ease-in-out infinite;
}

.intro-status {
    margin-top: 16px;

    font-size: 13px;
    letter-spacing: 4px;

    color: #d8b4fe;
}

@keyframes logoPulse {
    0%, 100% {
        transform: scale(1);
        opacity: 0.75;
    }

    50% {
        transform: scale(1.05);
        opacity: 1;
    }
}

@keyframes lineMove {
    0%, 100% {
        transform: scaleX(0.5);
    }

    50% {
        transform: scaleX(1);
    }
}

@keyframes introFade {
    0% {
        opacity: 1;
        visibility: visible;
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        visibility: hidden;
    }
}

/* ==========================================
   APP
========================================== */

.app {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
}

/* ==========================================
   HEADER
========================================== */

header {
    min-height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 16px 24px;

    background: rgba(5, 2, 12, 0.70);

    border-bottom:
        1px solid rgba(168, 85, 247, 0.35);

    backdrop-filter: blur(15px);

    box-shadow:
        0 5px 30px rgba(100, 20, 255, 0.12);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 3px;

    color: #ffffff;

    text-shadow:
        0 0 8px #a855f7,
        0 0 20px #7c3aed;
}

.profile {
    margin-top: 5px;

    font-size: 13px;
    color: #c4b5fd;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status {
    color: #70ff9b;
    font-size: 13px;
    font-weight: bold;

    text-shadow:
        0 0 10px rgba(112, 255, 155, 0.7);
}

.icon-btn {
    border: 1px solid rgba(168, 85, 247, 0.5);

    background: rgba(40, 10, 70, 0.65);

    color: white;

    padding: 9px 13px;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.25s;
}

.icon-btn:hover {
    transform: translateY(-2px);

    background: rgba(110, 30, 180, 0.75);

    box-shadow:
        0 0 15px rgba(168, 85, 247, 0.5);
}

/* ==========================================
   MUSIC PANEL
========================================== */

.music-panel {
    position: fixed;

    right: 25px;
    top: 95px;

    width: 330px;

    padding: 20px;

    border-radius: 18px;

    background: rgba(12, 5, 25, 0.90);

    border:
        1px solid rgba(168, 85, 247, 0.6);

    box-shadow:
        0 0 35px rgba(126, 34, 206, 0.35);

    backdrop-filter: blur(18px);

    transform: translateX(380px);

    opacity: 0;

    transition: 0.35s;

    z-index: 20;
}

.music-panel.active {
    transform: translateX(0);
    opacity: 1;
}

.music-title {
    font-size: 18px;
    font-weight: bold;

    color: #d8b4fe;

    margin-bottom: 10px;
}

.music-info {
    font-size: 13px;

    color: #c4b5fd;

    min-height: 38px;
}

.music-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;

    margin-top: 15px;
}

.music-controls button {
    border: 1px solid rgba(168, 85, 247, 0.5);

    background: rgba(80, 20, 130, 0.65);

    color: white;

    padding: 9px 12px;

    border-radius: 9px;

    cursor: pointer;
}

.music-controls button:hover {
    background: rgba(126, 34, 206, 0.8);
}

/* ==========================================
   CHAT
========================================== */

.chat {
    width: min(1000px, 94%);

    margin: 25px auto;

    flex: 1;

    display: flex;
    flex-direction: column;

    min-height: calc(100vh - 155px);
}

.messages {
    flex: 1;

    overflow-y: auto;

    padding: 25px;

    border-radius: 22px;

    background: rgba(5, 2, 15, 0.55);

    border:
        1px solid rgba(168, 85, 247, 0.25);

    backdrop-filter: blur(10px);

    box-shadow:
        inset 0 0 40px rgba(100, 20, 255, 0.08);
}

.messages::-webkit-scrollbar {
    width: 7px;
}

.messages::-webkit-scrollbar-thumb {
    background: #7c3aed;
    border-radius: 20px;
}

/* ==========================================
   WELCOME
========================================== */

.welcome {
    min-height: 420px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.welcome h1 {
    font-size: clamp(30px, 5vw, 52px);

    margin-bottom: 12px;

    text-shadow:
        0 0 15px rgba(168, 85, 247, 0.7);
}

.welcome p {
    color: #c4b5fd;

    font-size: 16px;
}

/* ==========================================
   MESSAGES
========================================== */

.message {
    width: fit-content;
    max-width: 78%;

    padding: 13px 16px;

    margin: 10px 0;

    border-radius: 15px;

    line-height: 1.5;

    word-wrap: break-word;

    animation: messageIn 0.25s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.message.user {
    margin-left: auto;

    background:
        linear-gradient(
            135deg,
            rgba(126, 34, 206, 0.85),
            rgba(88, 28, 135, 0.85)
        );

    border:
        1px solid rgba(216, 180, 254, 0.25);

    box-shadow:
        0 0 15px rgba(126, 34, 206, 0.20);
}

.message.aura {
    margin-right: auto;

    background: rgba(20, 8, 35, 0.82);

    border:
        1px solid rgba(168, 85, 247, 0.28);

    box-shadow:
        0 0 15px rgba(126, 34, 206, 0.12);
}

.message-time {
    display: block;

    margin-top: 6px;

    font-size: 10px;

    color: #a78bfa;
}

/* ==========================================
   COMPOSER
========================================== */

.composer {
    margin-top: 15px;

    padding: 14px;

    border-radius: 18px;

    background: rgba(5, 2, 15, 0.80);

    border:
        1px solid rgba(168, 85, 247, 0.35);

    backdrop-filter: blur(15px);

    box-shadow:
        0 0 30px rgba(100, 20, 255, 0.10);
}

textarea {
    width: 100%;

    min-height: 60px;
    max-height: 180px;

    resize: vertical;

    border: none;
    outline: none;

    border-radius: 12px;

    padding: 14px;

    background: rgba(20, 8, 35, 0.85);

    color: white;

    font-size: 15px;

    border:
        1px solid rgba(168, 85, 247, 0.25);
}

textarea::placeholder {
    color: #8b7ba8;
}

textarea:focus {
    border-color: #a855f7;

    box-shadow:
        0 0 15px rgba(168, 85, 247, 0.25);
}

.buttons {
    display: flex;

    justify-content: flex-end;

    gap: 9px;

    margin-top: 10px;
}

.buttons button {
    border: none;

    padding: 10px 16px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s;
}

.buttons button:hover {
    transform: translateY(-2px);
}

.kural {
    background: #70ff9b;
    color: #07100a;
}

.send {
    background:
        linear-gradient(
            135deg,
            #9333ea,
            #6d28d9
        );

    color: white;

    box-shadow:
        0 0 15px rgba(147, 51, 234, 0.35);
}

.buttons button:not(.kural):not(.send) {
    background: rgba(80, 20, 130, 0.75);
    color: white;
}

/* ==========================================
   FOOTER
========================================== */

footer {
    text-align: center;

    padding: 12px;

    font-size: 11px;

    color: #9f8bbd;

    background: rgba(5, 2, 12, 0.60);

    border-top:
        1px solid rgba(168, 85, 247, 0.18);
}

/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

    header {
        padding: 13px;
    }

    .status {
        display: none;
    }

    .logo {
        font-size: 20px;
    }

    .icon-btn {
        padding: 8px 9px;
        font-size: 12px;
    }

    .chat {
        width: 96%;
        margin: 12px auto;
    }

    .messages {
        padding: 14px;
    }

    .message {
        max-width: 88%;
    }

    .music-panel {
        left: 12px;
        right: 12px;
        top: 85px;
        width: auto;

        transform: translateY(-30px);
    }

    .music-panel.active {
        transform: translateY(0);
    }

    .buttons {
        flex-wrap: wrap;
    }

    .buttons button {
        flex: 1;
    }

    .intro-logo {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<!-- ==========================================
     PARTICLES
========================================== -->

<div class="aura-particles">

    <div class="aura-particle"
         style="left:10%;animation-delay:0s;"></div>

    <div class="aura-particle"
         style="left:25%;animation-delay:2s;"></div>

    <div class="aura-particle"
         style="left:40%;animation-delay:4s;"></div>

    <div class="aura-particle"
         style="left:55%;animation-delay:1s;"></div>

    <div class="aura-particle"
         style="left:70%;animation-delay:3s;"></div>

    <div class="aura-particle"
         style="left:85%;animation-delay:5s;"></div>

    <div class="aura-particle"
         style="left:95%;animation-delay:6s;"></div>

</div>

<!-- ==========================================
     INTRO
========================================== -->

<div id="auraIntro">

    <div class="intro-logo">
        AURA V9
    </div>

    <div class="intro-line"></div>

    <div class="intro-status">
        INITIALIZING...
    </div>

</div>

<!-- ==========================================
     APP
========================================== -->

<div class="app">

<header>

    <div>

        <div class="logo">
            AURA V9
        </div>

        <div
            class="profile"
            id="profileName"
        >
            User
        </div>

    </div>

    <div class="top-actions">

        <div class="status">
            ● ONLINE
        </div>

        <button
            class="icon-btn"
            onclick="newChat()"
            title="New Chat"
        >
            ＋
        </button>

        <button
            class="icon-btn"
            onclick="clearHistory()"
            title="Clear History"
        >
            🗑️
        </button>

        <button
            class="icon-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>

<!-- ==========================================
     MUSIC
========================================== -->

<div
    class="music-panel"
    id="musicPanel"
>

    <div class="music-title">
        🎵 AURA MUSIC
    </div>

    <div
        class="music-info"
        id="musicInfo"
    >
        Music mode ready
    </div>

    <div class="music-controls">

        <button onclick="playOnYouTube()">
            ▶️ YouTube
        </button>

        <button onclick="playOnSpotify()">
            🎧 Spotify
        </button>

        <button onclick="speakMusicArtist()">
            🔊 Artist
        </button>

        <button onclick="closeMusicMode()">
            ✕ Close
        </button>

    </div>

</div>

<!-- ==========================================
     CHAT
========================================== -->

<section class="chat">

    <div
        class="messages"
        id="messages"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                Welcome to AURA 🤖
            </h1>

            <p>
                Your AI assistant is ready.
            </p>

        </div>

    </div>

    <!-- COMPOSER -->

    <div class="composer">

        <textarea
            id="prompt"
            placeholder="Ask AURA anything..."
        ></textarea>

        <div class="buttons">

            <button
                class="kural"
                onclick="toggleKural()"
            >
                🎙️ Kural
            </button>

            <button
                onclick="musicMode()"
            >
                🎵 Music
            </button>

            <button
                class="send"
                onclick="sendChat()"
            >
                💬 Send
            </button>

        </div>

    </div>

</section>

<footer>
    AURA V9 • Ollama AI • Persistent User Data
</footer>

</div>

<script>

/* ==========================================
   USER
========================================== */

const USER_ID =
    localStorage.getItem("auraUser");

if (!USER_ID) {
    window.location.href = "/login.html";
}

/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.removeItem("auraUser");

    window.location.href = "/login.html";
}

/* ==========================================
   PROFILE
========================================== */

async function loadProfile() {

    try {

        const response =
            await fetch(
                `/api/profile?userId=${encodeURIComponent(USER_ID)}`
            );

        const data =
            await response.json();

        if (data.success) {

            document.getElementById(
                "profileName"
            ).textContent =
                `👤 ${data.profile.username}`;
        }

    } catch (error) {

        console.error(
            "Profile error:",
            error
        );
    }
}

/* ==========================================
   MESSAGE
========================================== */

function addMessage(
    text,
    type,
    time = null
) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const messages =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        `message ${type}`;

    div.textContent =
        text;

    if (time) {

        const timeElement =
            document.createElement("span");

        timeElement.className =
            "message-time";

        timeElement.textContent =
            new Date(time).toLocaleString();

        div.appendChild(
            timeElement
        );
    }

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;
}

/* ==========================================
   LOAD HISTORY
========================================== */

async function loadHistory() {

    try {

        const response =
            await fetch(
                `/api/history?userId=${encodeURIComponent(USER_ID)}`
            );

        const data =
            await response.json();

        if (!data.success) {
            return;
        }

        const messages =
            document.getElementById("messages");

        messages.innerHTML = "";

        if (
            !data.history ||
            data.history.length === 0
        ) {

            messages.innerHTML = `
                <div
                    class="welcome"
                    id="welcome"
                >
                    <h1>
                        Welcome back 🤖
                    </h1>

                    <p>
                        Your AURA conversation is ready.
                    </p>
                </div>
            `;

            return;
        }

        data.history.forEach(
            item => {

                addMessage(
                    item.content,
                    item.role === "user"
                        ? "user"
                        : "aura",
                    item.time
                );

            }
        );

    } catch (error) {

        console.error(
            "History error:",
            error
        );
    }
}

/* ==========================================
   NEW CHAT
========================================== */

async function newChat() {

    try {

        const response =
            await fetch(
                "/api/new-chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        userId: USER_ID
                    })
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            addMessage(
                data.error ||
                "Could not start new chat.",
                "aura"
            );

            return;
        }

        const messages =
            document.getElementById(
                "messages"
            );

        messages.innerHTML = `
            <div
                class="welcome"
                id="welcome"
            >
                <h1>
                    Vaanga, Vanakkam! 👋
                </h1>

                <p>
                    New AURA conversation started.
                </p>
            </div>
        `;

        speak(
            "Vaanga, Vanakkam!"
        );

    } catch (error) {

        console.error(
            "New chat error:",
            error
        );
    }
}

/* ==========================================
   CLEAR HISTORY
========================================== */

async function clearHistory() {

    const confirmed =
        confirm(
            "Clear all your AURA chat history?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/history",
                {
                    method: "DELETE",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        userId: USER_ID
                    })
                }
            );

        const data =
            await response.json();

        if (data.success) {

            await newChat();

        } else {

            alert(
                data.error ||
                "Could not clear history."
            );
        }

    } catch (error) {

        alert(
            "Could not connect to AURA."
        );
    }
}

/* ==========================================
   CHAT
========================================== */

async function sendChat() {

    const input =
        document.getElementById(
            "prompt"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    /* PLAY COMMAND */

    if (
        message
            .toLowerCase()
            .startsWith("play ")
    ) {

        const query =
            message
                .replace(/^play song /i, "")
                .replace(/^play /i, "")
                .trim();

        if (query) {

            document
                .getElementById(
                    "musicPanel"
                )
                .classList.add("active");

            document
                .getElementById(
                    "musicInfo"
                )
                .textContent =
                    `🎵 Searching for "${query}"...`;

            const youtubeUrl =
                "https://www.youtube.com/results?search_query=" +
                encodeURIComponent(query);

            window.open(
                youtubeUrl,
                "_blank"
            );

            return;
        }
    }

    addMessage(
        message,
        "user"
    );

    input.value = "";

    addMessage(
        "AURA is thinking...",
        "aura"
    );

    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        userId: USER_ID,
                        message: message
                    })
                }
            );

        const data =
            await response.json();

        const messages =
            document.getElementById(
                "messages"
            );

        const thinking =
            messages.querySelectorAll(
                ".aura"
            );

        if (thinking.length) {

            thinking[
                thinking.length - 1
            ].remove();
        }

        if (data.success) {

            addMessage(
                data.reply,
                "aura",
                new Date().toISOString()
            );

            if (voiceEnabled) {

                speak(
                    data.reply
                );
            }

        } else {

            addMessage(
                data.error ||
                "Something went wrong.",
                "aura"
            );
        }

    } catch (error) {

        console.error(
            "Chat error:",
            error
        );

        const messages =
            document.getElementById(
                "messages"
            );

        const thinking =
            messages.querySelectorAll(
                ".aura"
            );

        if (thinking.length) {

            thinking[
                thinking.length - 1
            ].remove();
        }

        addMessage(
            "❌ Cannot connect to AURA server.",
            "aura"
        );
    }
}

/* ==========================================
   KURAL
========================================== */

let voiceEnabled = false;

let recognition = null;

let listening = false;

function toggleKural() {

    voiceEnabled =
        !voiceEnabled;

    const button =
        document.querySelector(
            ".kural"
        );

    if (voiceEnabled) {

        button.textContent =
            "🎙️ Kural ON";

        speak(
            `Vanakkam ${USER_ID}. Sollunga.`
        );

        setTimeout(
            () => {
                startKuralListening();
            },
            700
        );

    } else {

        button.textContent =
            "🎙️ Kural";

        if (
            "speechSynthesis"
            in window
        ) {

            speechSynthesis.cancel();
        }

        if (
            recognition &&
            listening
        ) {

            recognition.stop();
        }
    }
}

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.rate = 1;

    utterance.pitch = 1;

    speechSynthesis.speak(
        utterance
    );
}

/* ==========================================
   VOICE INPUT
========================================== */

function startKuralListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser. Please use Chrome."
        );

        return;
    }

    if (listening) {

        recognition.stop();

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-IN";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;

    listening = true;

    updateKuralButton(
        true
    );

    recognition.onstart =
        function() {

            updateKuralButton(
                true
            );
        };

    recognition.onresult =
        function(event) {

            let finalText = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0]
                        .transcript;

                if (
                    event.results[i]
                        .isFinal
                ) {

                    finalText +=
                        transcript;
                }
            }

            if (finalText) {

                document.getElementById(
                    "prompt"
                ).value =
                    finalText;
            }
        };

    recognition.onerror =
        function(event) {

            console.error(
                "Kural voice error:",
                event.error
            );

            listening = false;

            updateKuralButton(
                false
            );
        };

    recognition.onend =
        function() {

            listening = false;

            updateKuralButton(
                false
            );
        };

    recognition.start();
}

function updateKuralButton(
    active
) {

    const button =
        document.querySelector(
            ".kural"
        );

    if (!button) {
        return;
    }

    if (active) {

        button.textContent =
            "🔴 Kural Listening...";

        button.style.background =
            "#ff5252";

        button.style.color =
            "white";

    } else {

        button.textContent =
            voiceEnabled
                ? "🎙️ Kural ON"
                : "🎙️ Kural";

        button.style.background =
            "#70ff9b";

        button.style.color =
            "#07100a";
    }
}

/* ==========================================
   MUSIC MODE
========================================== */

function musicMode() {

    const panel =
        document.getElementById(
            "musicPanel"
        );

    panel.classList.add(
        "active"
    );

    document.getElementById(
        "musicInfo"
    ).textContent =
        "🎵 Type a song name, then choose YouTube or Spotify.";
}

function getMusicQuery() {

    const input =
        document.getElementById(
            "prompt"
        );

    const query =
        input.value.trim();

    if (!query) {

        addMessage(
            "🎵 First type a song name.",
            "aura"
        );

        return null;
    }

    return query;
}

function playOnYouTube() {

    const query =
        getMusicQuery();

    if (!query) {
        return;
    }

    const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);

    document.getElementById(
        "musicInfo"
    ).textContent =
        `▶️ YouTube: ${query}`;

    window.open(
        url,
        "_blank"
    );
}

function playOnSpotify() {

    const query =
        getMusicQuery();

    if (!query) {
        return;
    }

    const url =
        "https://open.spotify.com/search/" +
        encodeURIComponent(query);

    document.getElementById(
        "musicInfo"
    ).textContent =
        `🎧 Spotify: ${query}`;

    window.open(
        url,
        "_blank"
    );
}

function speakMusicArtist() {

    const query =
        getMusicQuery();

    if (!query) {
        return;
    }

    speak(
        `Searching music for ${query}`
    );
}

function closeMusicMode() {

    document
        .getElementById(
            "musicPanel"
        )
        .classList.remove(
            "active"
        );
}
