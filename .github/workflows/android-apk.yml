name: Build AURA V9 Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "HTTPS URL of the deployed AURA V9 backend (for example https://your-app.example.com)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android web assets
        env:
          AURA_API_URL: ${{ inputs.api_url }}
        run: node scripts/prepare-android.js

      - name: Install Capacitor build tools
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-V9-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
