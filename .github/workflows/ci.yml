name: AURA V9 syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server and desktop JavaScript
        run: |
          node --check server.js
          node --check main.js
          node --check preload.js
      - name: Check browser JavaScript
        run: node scripts/check-inline-js.js
