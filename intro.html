<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA V9 Intro</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #08080f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.intro {
    text-align: center;
    animation: appear 1.5s ease;
}

.logo {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #70ff9b;
    text-shadow:
        0 0 10px #70ff9b,
        0 0 30px #70ff9b,
        0 0 60px #70ff9b;
}

.subtitle {
    margin-top: 15px;
    color: #aaa;
    font-size: 18px;
    letter-spacing: 3px;
}

.loader {
    width: 220px;
    height: 4px;
    background: #22222d;
    border-radius: 10px;
    margin: 35px auto 0;
    overflow: hidden;
}

.loader-bar {
    height: 100%;
    width: 0;
    background: #70ff9b;
    box-shadow: 0 0 15px #70ff9b;
    animation: loading 2.5s linear forwards;
}

@keyframes loading {
    from {
        width: 0;
    }

    to {
        width: 100%;
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 600px) {

    .logo {
        font-size: 48px;
        letter-spacing: 5px;
    }

    .subtitle {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="intro">

    <div class="logo">
        AURA V9
    </div>

    <div class="subtitle">
        YOUR AI ASSISTANT
    </div>

    <div class="loader">
        <div class="loader-bar"></div>
    </div>

</div>

<script>

setTimeout(function() {

    window.location.href = "/login.html";

}, 3000);

</script>

</body>
</html>
